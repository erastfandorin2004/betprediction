name: LVS watchdog (частый опрос + деплой окна T-60)

# Самодостаточный «сторож» БЕЗ внешних сервисов и без PAT.
# КОРОТКИЙ цикл: анализ/сеттлмент + коммит, и СБОРКА/ДЕПЛОЙ Pages — но деплой только
# если данные изменились (или это push с кодом), чтобы вхолостую не молотить. В конце
# цикл ПЕРЕЗАПУСКАЕТ САМ СЕБЯ (workflow_dispatch) — РАБОТАЕТ 24/7, пауза адаптивная
# (.lvs-next-sleep от cron: ~2 мин рядом с матчем, ~10 мин в простое). Так сайт у нас
# деплоится в пределах пары минут после появления составов/итога, без зависимости от
# троттла GitHub schedule. schedule/push — лишь точки ignite, если цепочка прервётся.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 */2 * * *' # подстраховочный ignite раз в 2 часа
  workflow_dispatch: {}

permissions:
  contents: write # коммит обновлённых JSON
  actions: write # перезапуск себя через workflow_dispatch
  pages: write # деплой Pages
  id-token: write

# Один цикл за раз; следующий встаёт в очередь (диспатчим его в самом конце).
concurrency:
  group: lvs-watchdog
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-score/shared build

      - name: Анализ/сеттлмент + коммит данных
        id: data
        env:
          LAOZHANG_API_KEY: ${{ secrets.LAOZHANG_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          git config user.name "lvs-bot"
          git config user.email "lvs-bot@users.noreply.github.com"
          node scripts/lvs-cron.mjs || true
          if ! git diff --quiet -- apps/web/public/data; then
            git add apps/web/public/data/*.json
            git commit -m "chore(lvs): авто-обновление прогнозов/итогов [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin main || (git pull --rebase --autostash origin main && git push origin main) || true
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Сборку/деплой делаем, только если данные поменялись ИЛИ это push (код мог
      # измениться) — иначе вхолостую гонять сборку незачем.
      - name: Нужен ли деплой
        id: need
        run: |
          if [ "${{ steps.data.outputs.changed }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.need.outputs.deploy == 'true'
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_STATIC: 'true'
      - if: steps.need.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.need.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - id: deploy
        if: steps.need.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4

      # Перезапуск себя — ВСЕГДА (24/7). Пауза адаптивная: рядом с матчем ~2 мин,
      # в простое ~10 мин (значение пишет cron в .lvs-next-sleep).
      - name: Перезапустить себя
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          S=$(cat .lvs-next-sleep 2>/dev/null || echo 300)
          case "$S" in (*[!0-9]*|'') S=300;; esac
          [ "$S" -gt 900 ] && S=900
          echo "пауза ${S}s до следующего цикла"
          sleep "$S"
          gh workflow run lvs-watchdog.yml || true
