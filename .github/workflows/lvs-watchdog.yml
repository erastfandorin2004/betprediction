name: LVS watchdog (частый опрос + деплой окна T-60)

# Самодостаточный «сторож» БЕЗ внешних сервисов и без PAT.
# Проблема: GitHub душит частые schedule-кроны, а длинная петля деплоила Pages
# только В КОНЦЕ прогона (раз в ~5 ч) — данные в git свежие, а ЖИВОЙ САЙТ отставал.
# Решение: КОРОТКИЙ цикл — один прогон = анализ/сеттлмент + коммит + СБОРКА И ДЕПЛОЙ
# Pages, после чего прогон ПЕРЕЗАПУСКАЕТ САМ СЕБЯ (workflow_dispatch). Так сайт
# обновляется каждые ~5 мин, и окно «за час до матча → составы → финал» видно сразу.
# Один прогон короткий (≤20 мин), цепочка идёт только в часы матчей (UTC 14:00–04:00),
# вне их — останавливается, ignite поднимает schedule.
on:
  # push — чтобы любой мой коммит МГНОВЕННО зажигал цепочку (и деплоил). Регулярную
  # работу дальше тянет самоперезапуск; schedule — холодные старты на случай обрыва.
  push:
    branches: [main]
  schedule:
    - cron: '3 14 * * *'
    - cron: '3 18 * * *'
    - cron: '3 22 * * *'
    - cron: '3 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write # коммит обновлённых JSON
  actions: write # перезапуск себя через workflow_dispatch
  pages: write # деплой Pages
  id-token: write

# Один цикл за раз; следующий встаёт в очередь (мы диспатчим его в самом конце).
concurrency:
  group: lvs-watchdog
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-score/shared build

      - name: Анализ/сеттлмент + коммит данных
        env:
          LAOZHANG_API_KEY: ${{ secrets.LAOZHANG_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          git config user.name "lvs-bot"
          git config user.email "lvs-bot@users.noreply.github.com"
          node scripts/lvs-cron.mjs || true
          if ! git diff --quiet -- apps/web/public/data; then
            git add apps/web/public/data/*.json
            git commit -m "chore(lvs): авто-обновление прогнозов/итогов [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin main || (git pull --rebase --autostash origin main && git push origin main) || true
          fi

      # Сборка и ДЕПЛОЙ свежего состояния — каждый цикл (берёт локальные JSON,
      # устойчиво к гонке push: деплоим то, что только что насчитали).
      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_STATIC: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - id: deploy
        uses: actions/deploy-pages@v4

      # Перезапуск себя для непрерывной цепочки — только в часы матчей (UTC 14–04),
      # чтобы не молотить впустую ночью/днём. Вне окна цепочка тормозит, ignite её
      # поднимает по schedule. workflow_dispatch встроенным токеном GitHub разрешает.
      - name: Перезапустить себя (в часы матчей)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          H=$(date -u +%H)
          if [ "$H" -ge 14 ] || [ "$H" -le 4 ]; then
            sleep 120 # пол цикла — целевая каденция ~5 мин
            gh workflow run lvs-watchdog.yml || true
          else
            echo "вне окна матчей (UTC $H) — цепочку не продолжаем"
          fi
