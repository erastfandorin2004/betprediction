name: LVS publish (analysis + Pages)

# Бесплатный «бэкенд» ЛВС на GitHub:
#  • по крону каждые ~15 мин запускаем анализ/сеттлмент (scripts/lvs-cron.mjs),
#    ключи берём из Secrets (LAOZHANG_API_KEY, API_FOOTBALL_KEY);
#  • обновлённые JSON коммитим в репо (неизменяемый трек-рекорд в истории git);
#  • собираем статический экспорт фронта и публикуем на GitHub Pages.
on:
  schedule:
    # Плотный опрос ТОЛЬКО в часы матчей ЧМ (UTC ≈15:00–04:00) — чтобы окно T-60
    # «составы → финальный прогноз» не промахивалось мимо запусков. Днём матчей нет,
    # крон не гоняем. ВАЖНО: GitHub душит частые schedule (по факту 2–3 запуска/сутки
    # вместо обещанных */15), поэтому гарантированную точность даёт ВНЕШНИЙ пингер
    # через repository_dispatch (см. ниже), а schedule оставлен как подстраховка.
    - cron: '*/15 15-23 * * *'
    - cron: '*/15 0-4 * * *'
  push:
    branches: [main]
  workflow_dispatch: {}
  # Внешний бесплатный планировщик (например cron-job.org) каждые ~10 мин шлёт POST
  #   https://api.github.com/repos/<owner>/<repo>/dispatches
  #   заголовки: Authorization: Bearer <PAT с правом actions:write>,
  #              Accept: application/vnd.github+json
  #   тело: {"event_type":"lvs-tick"}
  # Это гарантированный тик, не зависящий от троттлинга GitHub schedule.
  repository_dispatch:
    types: [lvs-tick]

permissions:
  contents: write # коммит обновлённых JSON
  pages: write # деплой Pages
  id-token: write # OIDC для deploy-pages

# Не запускаем параллельные публикации; крон-обновления не отменяем на полпути.
concurrency:
  group: lvs-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Версию pnpm берём из package.json (packageManager: pnpm@9.15.4),
      # явный version здесь приводит к конфликту в pnpm/action-setup@v4.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # shared нужен скрипту (dist) и фронту до сборки
      - run: pnpm --filter @ai-score/shared build

      - name: LVS анализ/сеттлмент (за час до матча + итог)
        env:
          LAOZHANG_API_KEY: ${{ secrets.LAOZHANG_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/lvs-cron.mjs

      - name: Коммит обновлённых данных
        run: |
          git config user.name "lvs-bot"
          git config user.email "lvs-bot@users.noreply.github.com"
          git add apps/web/public/data/*.json
          if git diff --cached --quiet; then
            echo "Данные не изменились — коммит не нужен"
          else
            git commit -m "chore(lvs): авто-обновление прогнозов/итогов [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin main || (git pull --rebase --autostash origin main && git push origin main)
          fi

      - name: Сборка статического экспорта
        env:
          NEXT_PUBLIC_STATIC: 'true'
        run: pnpm --filter web build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - id: deploy
        uses: actions/deploy-pages@v4
